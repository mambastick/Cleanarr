name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag, for example v0.2.10
        required: true
        type: string
      publish:
        description: Update the GitHub Release and upload native packages
        required: true
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NFPM_VERSION: v2.47.0

jobs:
  quality-gate:
    name: Required quality gates
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read

  compatibility-gate:
    name: Required compatibility gate
    uses: ./.github/workflows/compatibility.yml
    permissions:
      contents: read

  validate-release:
    name: Validate release metadata
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      release-tag: ${{ steps.release.outputs.release-tag }}
      package-version: ${{ steps.release.outputs.package-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate version and bilingual notes
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            release_tag="${GITHUB_REF_NAME}"
          else
            release_tag="${{ inputs.release_tag }}"
          fi
          version="${release_tag#v}"
          if [[ ! "${release_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: ${release_tag}" >&2
            exit 1
          fi

          project_version=$(python3 -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("backend/pyproject.toml").read_text())["project"]["version"])')
          app_version=$(sed -n 's/.*FastAPI(title="CleanArr", version="\([^"]*\)".*/\1/p' backend/src/cleanarr/api/app.py | head -n 1)
          if [[ "${project_version}" != "${version}" || "${app_version}" != "${version}" ]]; then
            echo "Tag ${release_tag}, package ${project_version}, and API ${app_version} must match" >&2
            exit 1
          fi

          notes_file="docs/releases/${release_tag}.md"
          test -f "${notes_file}"
          grep -Fxq '## Русский' "${notes_file}"
          grep -Fxq '## English' "${notes_file}"

          echo "release-tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "package-version=${version}" >> "${GITHUB_OUTPUT}"

  build-and-push:
    needs:
      - compatibility-gate
      - quality-gate
      - validate-release
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=${REGISTRY}/${IMAGE_NAME,,}" >> "${GITHUB_OUTPUT}"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate container SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}
          artifact-name: cleanarr-container-sbom
          output-file: cleanarr-container.spdx.json
          format: spdx-json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload container SBOM
        uses: actions/upload-artifact@v7
        with:
          name: cleanarr-container-sbom
          path: cleanarr-container.spdx.json
          if-no-files-found: error

      - name: Attest container build provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest container SBOM
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: cleanarr-container.spdx.json
          push-to-registry: true

  native-packages:
    name: Native packages (${{ matrix.arch }})
    needs:
      - compatibility-gate
      - quality-gate
      - validate-release
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Enable pnpm
        run: corepack enable

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.4"
          cache: false

      - name: Install nFPM
        run: go install "github.com/goreleaser/nfpm/v2/cmd/nfpm@${NFPM_VERSION}"

      - name: Build DEB and RPM
        env:
          PYTHON_BIN: python
        run: bash packaging/build-linux-packages.sh "${{ needs.validate-release.outputs.package-version }}" "${{ matrix.arch }}" dist

      - name: Generate package SBOM
        uses: anchore/sbom-action@v0
        with:
          path: dist
          artifact-name: cleanarr-packages-${{ matrix.arch }}-sbom
          output-file: dist/cleanarr-packages-${{ matrix.arch }}.spdx.json
          format: spdx-json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cleanarr-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs:
      - validate-release
      - build-and-push
      - native-packages
    if: >-
      ${{ always()
          && needs.validate-release.result == 'success'
          && needs.native-packages.result == 'success'
          && (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped')
          && (github.event_name == 'push' || inputs.publish) }}
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.validate-release.outputs.release-tag }}
      PACKAGE_VERSION: ${{ needs.validate-release.outputs.package-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download native packages
        uses: actions/download-artifact@v8
        with:
          pattern: cleanarr-linux-*
          path: release-assets
          merge-multiple: true

      - name: Download container SBOM
        if: needs.build-and-push.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: cleanarr-container-sbom
          path: release-assets

      - name: Create checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum ./*.deb ./*.rpm ./*.spdx.json | sort -k2 > SHA256SUMS

      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-path: release-assets/*

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          notes_file="docs/releases/${RELEASE_TAG}.md"
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --title "CleanArr ${PACKAGE_VERSION}" \
              --notes-file "${notes_file}"
          else
            gh release create "${RELEASE_TAG}" \
              --title "CleanArr ${PACKAGE_VERSION}" \
              --notes-file "${notes_file}"
          fi
          gh release upload "${RELEASE_TAG}" release-assets/* --clobber
